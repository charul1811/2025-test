##=============================================================================
## Nuxeo configuration file for Docker
##=============================================================================

##-----------------------------------------------------------------------------
## Java
##-----------------------------------------------------------------------------
JAVA_OPTS=$JAVA_OPTS -Dfile.encoding=UTF-8 -Dmail.mime.decodeparameters=true
JAVA_OPTS=$JAVA_OPTS -Djava.util.Arrays.useLegacyMergeSort=true
JAVA_OPTS=$JAVA_OPTS -Xloggc:"${nuxeo.log.dir}/gc.log" -verbose:gc -XX:+PrintGCDetails -XX:+PrintGCTimeStamps

##-----------------------------------------------------------------------------
## Templates
##-----------------------------------------------------------------------------
nuxeo.templates=default,docker,mongodb

##-----------------------------------------------------------------------------
## MongoDB Configuration
##-----------------------------------------------------------------------------
nuxeo.mongodb.server=mongodb:27017
nuxeo.mongodb.dbname=nuxeo

##-----------------------------------------------------------------------------
## Database (for fallback/compatibility)
##-----------------------------------------------------------------------------
nuxeo.db.host=mongodb
nuxeo.db.name=${env:NUXEO_DB_NAME:nuxeo}
nuxeo.db.user=${env:NUXEO_DB_USER:nuxeo}
nuxeo.db.password=${env:NUXEO_DB_PASSWORD:nuxeo}

##-----------------------------------------------------------------------------
## Server URLs
##-----------------------------------------------------------------------------
nuxeo.url=${env:NUXEO_URL:http://localhost:8091/nuxeo}

##-----------------------------------------------------------------------------
## Elasticsearch Configuration
##-----------------------------------------------------------------------------
elasticsearch.addressList=${env:NUXEO_ES_HOSTS:localhost:9200}
elasticsearch.clusterName=${env:NUXEO_ES_CLUSTER_NAME:docker-cluster}
elasticsearch.indexName=${env:NUXEO_ES_INDEX_NAME:nuxeo}
elasticsearch.indexNumberOfReplicas=${env:NUXEO_ES_REPLICAS:0}
elasticsearch.indexNumberOfShards=${env:NUXEO_ES_SHARDS:1}
elasticsearch.httpEnabled=${env:NUXEO_ES_HTTP_ENABLED:true}

##-----------------------------------------------------------------------------
## Audit
##-----------------------------------------------------------------------------
audit.elasticsearch.enabled=${env:NUXEO_AUDIT_ES_ENABLED:true}

##-----------------------------------------------------------------------------
## Development Mode
##-----------------------------------------------------------------------------
org.nuxeo.automation.trace=${env:NUXEO_AUTOMATION_TRACE:false}
org.nuxeo.dev=${env:NUXEO_DEV_MODE:true}
org.nuxeo.rest.stack.enable=true
nuxeo.server.sdk=true
nuxeo.server.sdkInstallReloadTimer=true

##-----------------------------------------------------------------------------
## Paths
##-----------------------------------------------------------------------------
nuxeo.log.dir=/var/log/nuxeo
nuxeo.pid.dir=/var/run/nuxeo
nuxeo.data.dir=/var/lib/nuxeo/data
repository.binary.store=${env:NUXEO_BINARY_STORE:/var/lib/nuxeo/binaries}

##-----------------------------------------------------------------------------
## Misc
##-----------------------------------------------------------------------------
nuxeo.force.generation=true
nuxeo.vcs.ddlmode=${env:NUXEO_DDL_MODE:create}
nuxeo.wizard.done=true
server.status.key=2e49b616
nuxeo.clid=${env:NUXEO_CLID:bc6062de-7121-4cca-8b2b-8204be63cfa8.1760785134.--88597e06-34e5-4476-bc28-af3424babb9e}
nuxeo.user=${env:NUXEO_USER}
nuxeo.password=${env:NUXEO_PASSWORD}
nuxeo.dbs.cache.enabled=false
nuxeo.dbs.cache.maxSize=1000